#############################################################################
# Percepio Tracealyzer and Detect - Reference Configuration for Zephyr
#############################################################################

# ---------------------------------------------------------------------------
# Percepio TraceRecorder - Required/Recommended Settings 
# for Detect and Tracealyzer snapshots
# ---------------------------------------------------------------------------

# Master switch for Zephyr tracing support 
CONFIG_TRACING=y

# Enable Percepio TraceRecorder
CONFIG_PERCEPIO_TRACERECORDER=y

# How to store the trace data (ring-buffer in target RAM)
CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RINGBUFFER=y
CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RINGBUFFER_SIZE=4096

# Exclude less important events for longer traces (Recommended)
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_SYSCALL=n
CONFIG_PERCEPIO_TRC_CFG_INCLUDE_BUSY_WAIT=n
CONFIG_PERCEPIO_TRC_CFG_INCLUDE_YIELD=n
CONFIG_PERCEPIO_TRC_CFG_INCLUDE_SCHED_LOCK=n

# Enable this to use Arm DWT-based timestamping. This typically provides
# higher timestamp resolution than the default timebase, but is specific
# to Cortex-M devices with DWT support (e.g. Cortex-M3/M4/M7 and many M33
# implementations). Not supported by the QEMU targets used by this demo.
CONFIG_CORTEX_M_DWT=n

# Keep QEMU's instruction-count mode, but advance time at wall-clock speed
# while the virtual CPU sleeps so demo delays remain readable.
CONFIG_QEMU_ICOUNT=y
CONFIG_QEMU_ICOUNT_SLEEP=y

# Enable internal error handling (Recommended)
CONFIG_PERCEPIO_TRC_CFG_USE_TRACE_ASSERT=y

# Enables periodic stack usage monitoring (for Tracealyzer)
CONFIG_PERCEPIO_TRC_CFG_ENABLE_STACK_MONITOR=y

# Settings for Trace Control Task (TzCtrl, also runs the Stack Monitor)
CONFIG_PERCEPIO_TRC_CFG_CTRL_TASK_PRIORITY=0
CONFIG_PERCEPIO_TRC_CFG_CTRL_TASK_DELAY=250
CONFIG_PERCEPIO_TRC_CFG_CTRL_TASK_STACK_SIZE=1024


# ---------------------------------------------------------------------------
# Stack Corruption Detection
# ---------------------------------------------------------------------------

# For stack checking / stack corruption detection. qemu_cortex_m3 has no
# entropy device, so use Zephyr's deterministic test RNG to seed canaries.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_STACK_CANARIES_STRONG=y
CONFIG_STACK_SENTINEL=y

# DFM fault processing needs sufficient MSP stack
CONFIG_ISR_STACK_SIZE=1024

# ---------------------------------------------------------------------------
# Percepio Detect - Required/Recommended Settings
# ---------------------------------------------------------------------------

# Master switch that enables the DFM library (Percepio Detect API)
CONFIG_PERCEPIO_DFM=y

# The device software version provided in the DFM alert metadata
CONFIG_PERCEPIO_DFM_CFG_FIRMWARE_VERSION="1.0.0"

# Select the Detect transport
CONFIG_PERCEPIO_DFM_CFG_CLOUDPORT_SERIAL=y

# Required for alert checksums
CONFIG_CRC=y

# Required for DFM_TRAP() to restart the device
CONFIG_REBOOT=y

# Enables the DFM TaskMonitor for per-thread CPU load anomaly detection,
# generating alerts with traces when anomalies occur.
CONFIG_PERCEPIO_TRC_CFG_ENABLE_TASK_MONITOR=y

# For DFM TaskMonitor - the maximum number of threads that can be monitored.
# Should match or exceed the number of threads registered via xDfmTaskMonitorRegister().
CONFIG_PERCEPIO_TRC_CFG_TASK_MONITOR_MAX_TASKS=2

# Needed by the DFM TaskMonitor
CONFIG_THREAD_LOCAL_STORAGE=y

# Required by DFM_TRAP() on Arm Cortex-M devices to run in exception
# handler context, allowing it to emulate a fault exception and trigger a core dump.
CONFIG_IRQ_OFFLOAD=y

# Zephyr's irq_offload() API is part of the Zephyr test infrastructure and therefore
# requires CONFIG_TEST. DFM_TRAP() depends on irq_offload() on Arm Cortex-M.
#
# Our preliminary analysis indicates that CONFIG_TEST has the following
# side effects, depending on the Zephyr version and target:
# - Enables thread naming support via CONFIG_THREAD_NAME.
# - Enables Zephyr test logging defaults, which may enable logging.
# - May enable hardware stack protection when supported by the target.
# - Enables Cortex-M-specific test configuration via CONFIG_TEST_ARM_CORTEX_M,
#   which may affect stack sizing, null-pointer detection, and exception
#   routing on some Arm targets, including Secure Armv8-M builds.
CONFIG_TEST=y


# ---------------------------------------------------------------------------
# Core Dumps
# ---------------------------------------------------------------------------

# Enable the DFM core dump support
CONFIG_PERCEPIO_DFM_CFG_ENABLE_COREDUMPS=y

# Enable core dump support in Zephyr
CONFIG_DEBUG_COREDUMP=y

# Preserve r4-r11 in the exception frame. In particular, GCC uses r7 as the
# frame pointer at -O0, so this is required for correct locals and unwinding.
CONFIG_EXTRA_EXCEPTION_INFO=y

# Select the core dump backend "other" (DFM trcKernelPort.c)
CONFIG_DEBUG_COREDUMP_BACKEND_OTHER=y

# Use the minimal core dump format (the only supported option in Detect 2026.1)
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# Reduce dump size by including only the top part of the faulting thread's stack.
# The upper limit is set by CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP_LIMIT.
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP=y

# Maximum number of stack bytes included in the core dump.
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP_LIMIT=128

# Ensures core dumps are transmitted directly
CONFIG_PERCEPIO_DFM_CFG_COREDUMP_SEND=y


# ---------------------------------------------------------------------------
# Retained Memory
# ---------------------------------------------------------------------------
# "Retained Memory" means that the DFM alert data is initially
# stored in ".noinit" RAM that survives a restart.
# DFM can be configured to use Zephyr Retained Memory support.
# This way, the system can be restarted to recover from a fault 
# without losing the alert data and transmit it later.
# (Still TODO - Not yet demonstrated here.)

# CONFIG_PERCEPIO_DFM_CFG_COREDUMP_RETAIN=n
# CONFIG_RETENTION=n
# CONFIG_RETAINED_MEM=n
# CONFIG_PERCEPIO_DFM_CFG_RETAINED_MEMORY=y
# CONFIG_PERCEPIO_DFM_CFG_COREDUMP_RETAIN=y


# ---------------------------------------------------------------------------
# DFM Diagnostics for Integration Verification and Debugging
# ---------------------------------------------------------------------------

# Enables diagnostic printk statements in DFM.
CONFIG_PERCEPIO_DFM_CFG_ENABLE_DEBUG_PRINT=y

# Enable thread awareness for debugging tools supporting it.
CONFIG_DEBUG_THREAD_INFO=y

# Disables compiler optimizations
CONFIG_NO_OPTIMIZATIONS=y
#CONFIG_DEBUG_OPTIMIZATIONS=y


# ---------------------------------------------------------------------------
# Demo-specific Configuration
# ---------------------------------------------------------------------------

# Default is 15, but make it explicit.
CONFIG_NUM_PREEMPT_PRIORITIES=15

# The demo uses sub-10 ms sleeps, so increase the tick resolution.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000


