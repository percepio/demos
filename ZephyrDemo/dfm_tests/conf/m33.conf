# Armv8-M qualification: active FP context and PSPLIM stack protection.
CONFIG_PERCEPIO_DFM_CFG_FIRMWARE_VERSION="Build-M33-Qual"
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_HW_STACK_PROTECTION=y

# Leave margin for the extended exception frame and DFM processing while the
# process-stack fixture deliberately consumes a substantial part of its PSP.
CONFIG_ISR_STACK_SIZE=2048
